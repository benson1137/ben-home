<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Ben</title>
<meta name="description" content="Ben 的个人主页">
<style>
  :root { --bg:#fafaf9; --fg:#1c1917; --muted:#78716c; --card:#fff; --line:#e7e5e4; --accent:#f97316; }
  @media (prefers-color-scheme: dark) { :root { --bg:#0c0a09; --fg:#f5f5f4; --muted:#a8a29e; --card:#1c1917; --line:#292524; } }
  * { box-sizing:border-box; margin:0; padding:0; }
  body { font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", "PingFang SC", "Noto Sans SC", sans-serif;
         background:var(--bg); color:var(--fg); min-height:100vh; display:flex; align-items:center; justify-content:center; padding:24px; }
  main { width:100%; max-width:520px; text-align:center; }
  .avatar { width:96px; height:96px; border-radius:50%; margin:0 auto 20px; display:block; border:3px solid var(--line); }
  h1 { font-size:2rem; letter-spacing:-.02em; }
  p.bio { color:var(--muted); margin:10px 0 28px; line-height:1.6; }
  nav { display:flex; flex-direction:column; gap:12px; }
  nav a { display:block; padding:14px 18px; border:1px solid var(--line); border-radius:12px; background:var(--card);
          color:var(--fg); text-decoration:none; font-weight:500; transition:border-color .15s, transform .15s; }
  nav a:hover { border-color:var(--accent); transform:translateY(-1px); }
  footer { margin-top:36px; color:var(--muted); font-size:.85rem; }
</style>
</head>
<body>
<main>
  <img class="avatar" src="https://github.com/benson1137.png" alt="Ben 的头像">
  <h1>Ben</h1>
  <p class="bio">你好，我是 Ben。这里是我的个人主页。</p>
  <nav>
    <a href="https://github.com/benson1137" target="_blank" rel="noopener">GitHub · benson1137</a>
  </nav>
  <footer>© <span id="y"></span> Ben</footer>
</main>
<script>document.getElementById('y').textContent = new Date().getFullYear();</script>
</body>
</html>
